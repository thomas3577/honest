name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Setup repo
        uses: actions/checkout@v7.0.1

      - name: Setup Deno
        uses: denoland/setup-deno@v2.0.5
        with:
          deno-version: v2.9.6

      - name: Verify formatting
        run: deno fmt --check

      - name: Run linter
        run: deno lint

      - name: Verify package
        run: deno publish --dry-run

  test:
    name: test (${{ matrix.runtime }} ${{ matrix.version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: deno
            version: v2.9.6
          - runtime: node
            version: 22
          - runtime: node
            version: 24
          - runtime: bun
            version: 1.4.3

    steps:
      - name: Setup repo
        uses: actions/checkout@v7.0.1

      - name: Setup Deno
        if: matrix.runtime == 'deno'
        uses: denoland/setup-deno@v2.0.5
        with:
          deno-version: ${{ matrix.version }}

      - name: Setup Node.js
        if: matrix.runtime == 'node'
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ matrix.version }}

      - name: Setup Bun
        if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: ${{ matrix.version }}

      - name: Install dependencies
        if: matrix.runtime != 'deno'
        run: npm ci

      - name: Run tests (Deno)
        if: matrix.runtime == 'deno'
        run: deno test --allow-env

      - name: Run tests (Node.js)
        if: matrix.runtime == 'node'
        run: npm test

      - name: Run tests (Bun)
        if: matrix.runtime == 'bun'
        run: bun test

  workers:
    runs-on: ubuntu-latest

    steps:
      - name: Setup repo
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix test/workers

      - name: Run tests (Cloudflare Workers)
        run: npm test --prefix test/workers
